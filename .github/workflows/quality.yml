name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Preserve Git blob bytes on every runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation phase and frozen snapshot
        run: python scripts/verify-retirement.py
      - name: Verify corruption and source-resurrection detection
        run: python scripts/verify-retirement.py --self-test
      - name: Verify Foundation document integrity and negative cases
        run: python scripts/verify-foundation.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned package manager and locked development tools
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check module boundaries and strict TypeScript
        run: pnpm check
      - name: Run product behavior and filesystem tests
        run: pnpm test
      - name: Emit runnable JavaScript
        run: pnpm build
      - name: Verify real Chromium transaction and restart behavior
        run: pnpm test:browser
      - name: Verify actual Studio editing and recovery in Chromium
        run: pnpm test:studio
      - name: Consume emitted Web and React Native target source
        run: pnpm test:targets
      - name: Retain actual browser and consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-target-evidence-${{ matrix.os }}
          path: |
            dist/evidence/
            dist/target-verification/evidence.json
          if-no-files-found: ignore
