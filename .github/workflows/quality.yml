name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation phase and frozen snapshot
        run: python3 scripts/verify-retirement.py
      - name: Verify corruption and source-resurrection detection
        run: python3 scripts/verify-retirement.py --self-test
      - name: Verify Foundation document integrity and negative cases
        run: python3 scripts/verify-foundation.py --self-test
