name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation phase and frozen snapshot
        run: python scripts/verify-retirement.py
      - name: Verify corruption and source-resurrection detection
        run: python scripts/verify-retirement.py --self-test
      - name: Verify Foundation document integrity and negative cases
        run: python scripts/verify-foundation.py --self-test
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned package manager and locked development tools
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check module boundaries and strict TypeScript
        run: pnpm check
      - name: Run product behavior and filesystem tests
        run: pnpm test
      - name: Emit runnable JavaScript
        run: pnpm build
