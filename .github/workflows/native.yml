name: Native Runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose Android instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install the locked source generator
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.1.0'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Prepare the pinned Android compile SDK and emulator acceleration
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile generated source and execute native controls
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/native-verify.mjs compose
      - name: Preserve native results, consumer locks and compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-compose-evidence
          path: |
            dist/native-verification/**/*evidence.json
            dist/native-verification/**/command-*.log
            dist/native-verification/**/gradle.lockfile
            dist/native-verification/**/gradle/verification-metadata.xml
            dist/native-verification/**/build/outputs/androidTest-results/
            dist/native-verification/**/build/reports/androidTests/
          if-no-files-found: warn

  swiftui:
    name: SwiftUI iOS simulator runtime
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install the locked source generator
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile and run generated SwiftUI in a fresh iOS simulator
        run: node scripts/native-verify.mjs swiftui
      - name: Preserve actual compiler, SDK, simulator and rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-swiftui-evidence
          path: |
            dist/native-verification/**/*evidence.json
            dist/native-verification/**/command-*.log
          if-no-files-found: warn
